name: Telegram Bot (Polling Runner)

# ⚠️ GitHub Actions على الخطة المجانية لديها حدود:
# - أقصى مدة للتشغيل: 6 ساعات للجوب الواحدة (نحدد 350 دقيقة)
# - حدود شهرية: ~2000 دقيقة للحساب المجاني (يكفي ~33 ساعة فقط)
# - لا يوجد منافذ واردة، لذلك نستخدم وضع Polling عبر bot.py
# هذا الوورك فلو يعيد التشغيل مجدداً كل 5 ساعات لتقليل الانقطاع.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"  # كل 5 ساعات إعادة تشغيل تلقائي

concurrency:
  group: telegram-bot-polling
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # أقل من حد الـ 6 ساعات

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot in polling mode
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_SECRET: ${{ secrets.PAYPAL_SECRET }}
          PAYPAL_ENV: ${{ secrets.PAYPAL_ENV }}
          PAYPAL_ME_LINK: ${{ secrets.PAYPAL_ME_LINK }}
        run: |
          echo "Starting bot.py in polling mode"
          python bot.py
